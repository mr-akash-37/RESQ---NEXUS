<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resources — ResQ Nexus</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="/" class="brand"><span class="mark">●</span> ResQ Nexus</a>
    <div class="nav-links">
      <a href="/" data-i18n="nav_home">Home</a>
      <a href="/report" data-i18n="nav_report">Report incident</a>
      <a href="/dashboard" data-i18n="nav_dashboard">Dashboard</a>
      <a href="/resources" class="active" data-i18n="nav_resources">Resources</a>
      <a href="/alerts" data-i18n="nav_alerts">Alerts</a>
    </div>
    <select id="langToggle" class="nav-lang">
      <option value="en">EN</option>
      <option value="hi">हिं</option>
    </select>
  </div>
</nav>

<header class="page-head">
  <div class="container">
    <h1>Resource inventory</h1>
    <p>Every ambulance, rescue boat, shelter, and supply depot the allocation engine can dispatch.</p>
  </div>
</header>

<section class="container mt-40">
  <div class="flex" style="justify-content:space-between; align-items:center; margin-bottom:16px">
    <h3 style="margin:0">Registered resources</h3>
    <button class="btn btn-primary btn-sm" id="addToggle">Add resource</button>
  </div>

  <form id="addForm" class="panel form-grid mt-24" style="display:none; margin-bottom:24px">
    <div class="field">
      <label for="resource_type">Type</label>
      <select id="resource_type">
        <option value="ambulance">Ambulance</option>
        <option value="rescue_boat">Rescue boat</option>
        <option value="shelter">Shelter</option>
        <option value="medical_team">Medical team</option>
        <option value="food_kit">Food kit</option>
        <option value="fire_truck">Fire truck</option>
        <option value="water_tanker">Water tanker</option>
        <option value="personnel">Personnel</option>
      </select>
    </div>
    <div class="field">
      <label for="name">Name / call sign</label>
      <input type="text" id="name" required>
    </div>
    <div class="field">
      <label for="lat">Latitude</label>
      <input type="number" step="any" id="lat" required>
    </div>
    <div class="field">
      <label for="lon">Longitude</label>
      <input type="number" step="any" id="lon" required>
    </div>
    <div class="field">
      <label for="capacity">Capacity</label>
      <input type="number" id="capacity" value="1" min="1">
    </div>
    <div class="field">
      <label for="quantity_available">Quantity available</label>
      <input type="number" id="quantity_available" value="1" min="0">
    </div>
    <div class="field full">
      <button type="submit" class="btn btn-primary">Save resource</button>
    </div>
  </form>

  <div class="panel">
    <table id="resourceTable">
      <thead>
        <tr><th>Name</th><th>Type</th><th>Status</th><th>Available</th><th class="mono">Location</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
</section>

<script src="/js/common.js"></script>
<script>
async function loadResources() {
  const resources = await api('/api/resources');
  const tbody = document.querySelector('#resourceTable tbody');
  tbody.innerHTML = resources.map((r) => `
    <tr>
      <td>${r.name}</td>
      <td>${r.resource_type.replace('_',' ')}</td>
      <td><span class="badge ${r.status === 'available' ? 'severity-low' : 'severity-mid'}">${r.status}</span></td>
      <td>${r.quantity_available}/${r.capacity}</td>
      <td class="mono">${r.lat.toFixed(3)}, ${r.lon.toFixed(3)}</td>
    </tr>
  `).join('');
}

document.getElementById('addToggle').addEventListener('click', () => {
  const f = document.getElementById('addForm');
  f.style.display = f.style.display === 'none' ? 'grid' : 'none';
});

document.getElementById('addForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await api('/api/resources', {
      method: 'POST',
      body: JSON.stringify({
        resource_type: document.getElementById('resource_type').value,
        name: document.getElementById('name').value,
        lat: parseFloat(document.getElementById('lat').value),
        lon: parseFloat(document.getElementById('lon').value),
        capacity: Number(document.getElementById('capacity').value),
        quantity_available: Number(document.getElementById('quantity_available').value)
      })
    });
    toast('Resource added.');
    document.getElementById('addForm').reset();
    document.getElementById('addForm').style.display = 'none';
    loadResources();
  } catch (err) {
    toast(err.message, true);
  }
});

loadResources().catch((e) => toast(e.message, true));
</script>
</body>
</html>
