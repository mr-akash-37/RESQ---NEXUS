<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — ResQ Nexus</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  body { padding-bottom: 64px; }
  .leaflet-container { background: #0b1420 !important; font-family: var(--font-body); }
</style>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <a href="/" class="brand"><span class="mark">●</span> ResQ Nexus</a>
    <div class="nav-links">
      <a href="/" data-i18n="nav_home">Home</a>
      <a href="/report" data-i18n="nav_report">Report incident</a>
      <a href="/dashboard" class="active" data-i18n="nav_dashboard">Dashboard</a>
      <a href="/resources" data-i18n="nav_resources">Resources</a>
      <a href="/alerts" data-i18n="nav_alerts">Alerts</a>
    </div>
    <select id="langToggle" class="nav-lang">
      <option value="en">EN</option>
      <option value="hi">हिं</option>
    </select>
  </div>
</nav>

<div class="dash-shell">
  <aside class="dash-feed">
    <div class="flex" style="justify-content:space-between; align-items:center; margin-bottom:12px">
      <h3 style="margin:0">Incident feed</h3>
      <button class="btn btn-outline btn-sm" id="refreshBtn">Refresh</button>
    </div>
    <div id="feedList"></div>
  </aside>
  <main id="map"></main>
</div>

<div class="dash-bottom">
  <button class="btn btn-primary" id="allocateBtn">Run allocation</button>
  <span class="muted mono" id="allocStatus">No allocation run yet</span>
  <div style="flex:1"></div>
  <span class="muted mono" id="resourceSummary"></span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/js/common.js"></script>
<script src="/js/dashboard.js"></script>
</body>
</html>
